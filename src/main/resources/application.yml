server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/userservice
    username: userservice
    password: userservice
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
